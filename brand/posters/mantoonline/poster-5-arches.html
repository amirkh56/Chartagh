<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>چارطاق — سه طاق</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: linear-gradient(170deg, var(--c-brick) 0%, var(--c-mid) 55%, var(--c-dark) 100%); color: var(--c-kahgel); }
  h1 { position: absolute; top: 250px; right: 80px; left: 80px; font-size: 92px; font-weight: 900; line-height: 1.18; color: #fff; }
  h1 em { font-style: normal; color: var(--c-dood); }
  .arches { position: absolute; top: 640px; left: 60px; right: 60px; display: flex; gap: 24px; align-items: flex-end; }
  .arches div { flex: 1; height: 620px; border: 8px solid var(--c-kahgel); }
  .arches div:nth-child(2) { height: 760px; }
  .site { position: absolute; top: 1440px; left: 0; right: 0; text-align: center; }
  .site span { background: var(--c-dood); color: var(--c-kahgel); font-size: 32px; padding: 14px 40px; border-radius: 999px; }
  .frieze { top: 1525px; opacity: .45; filter: brightness(2.2); }
  .credit { top: 1600px; }
  .credit img { width: 120px; height: 136px; }
  .credit b { font-size: 84px; line-height: 1; color: #fff; }
  .credit small { font-size: 30px; margin-top: 8px; color: var(--c-kahgel); opacity: .9; }
  .credit .handle { font-size: 30px; color: #fff; opacity: 1; }
</style></head>
<body>
  <h1>برای مانتو آنلاین<br>سایتی <em>دوختیم</em><br>به قامت برندش.</h1>
  <div class="arches">
    <div class="arch-ph" style="background-image:url(photos/p26.jpg)"></div>
    <div class="arch-ph" style="background-image:url(photos/p28.jpg)"></div>
    <div class="arch-ph" style="background-image:url(photos/p23.jpg)"></div>
  </div>
  <div class="site"><span class="latin">mantoonline.com</span></div>
  <div class="frieze"></div>
  <div class="credit">
    <img src="logo-brick.svg" alt="">
    <div><b>چارطاق</b><small>طراحی سایت · پوستر · سئو</small></div>
    <span class="handle latin">@chartagh.agency</span>
  </div>
</body></html>
