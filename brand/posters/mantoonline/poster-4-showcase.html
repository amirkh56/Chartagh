<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>چارطاق — نمونه‌کار مانتو آنلاین</title>
<link rel="stylesheet" href="poster.css">
<style>
  /* Chartagh-led: the agency is the headline, the client is the proof */
  body { background: radial-gradient(80% 50% at 50% 55%, #4a2318 0%, var(--c-dood) 70%); color: var(--c-kahgel); }
  .frieze { top: 170px; }
  .brand { position: absolute; top: 260px; right: 80px; left: 80px; display: flex; align-items: center; gap: 28px; }
  .brand img { width: 150px; height: 170px; }
  .brand b { display: block; font-size: 140px; font-weight: 900; line-height: 1; color: #fff; }
  .brand small { display: block; font-size: 34px; font-weight: 700; color: var(--c-terracotta, #C0704C); margin-top: 10px; }
  .ph { position: absolute; }
  .ph1 { top: 620px; right: 70px; width: 330px; height: 520px; background-image: url(photos/p28.jpg); transform: rotate(5deg); }
  .ph2 { top: 700px; left: 70px; width: 330px; height: 520px; background-image: url(photos/p23.jpg); transform: rotate(-5deg); }
  .phone { position: absolute; top: 560px; left: 50%; transform: translateX(-50%); width: 400px; height: 820px; border-radius: 58px; background: #0d0806; padding: 14px; box-shadow: 0 50px 100px rgba(0,0,0,.6); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 46px; display: block; }
  .label { position: absolute; top: 1420px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 700; color: var(--m-sand); }
  .label .latin { font-size: 30px; opacity: .8; }
  h2 { position: absolute; top: 1490px; left: 0; right: 0; text-align: center; font-size: 66px; font-weight: 900; color: #fff; }
  h2 span { color: var(--c-brick); }
  .cta { position: absolute; top: 1610px; left: 50%; transform: translateX(-50%); background: var(--c-brick); color: #fff; white-space: nowrap; }
</style></head>
<body>
  <div class="frieze"></div>
  <div class="brand">
    <img src="logo-dark.svg" alt="">
    <div><b>چارطاق</b><small>نمونه‌کار تازه‌ی ما</small></div>
  </div>
  <div class="ph arch-ph ph1"></div>
  <div class="ph arch-ph ph2"></div>
  <div class="phone"><img src="mobile-hero.png" alt=""></div>
  <div class="label">فروشگاه اینترنتی مانتو آنلاین · <span class="latin">mantoonline.com</span></div>
  <h2>سایت شما، <span>نمونه‌کار بعدی</span> ما.</h2>
  <div class="cta">سفارش در دایرکت <span class="latin">@chartagh.agency</span></div>
</body></html>
