<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>چارطاق — کار کیه؟</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: var(--c-kahgel); color: var(--c-dood); }
  .q { position: absolute; top: 250px; right: 80px; font-size: 84px; font-weight: 900; line-height: 1.15; }
  .q span { color: var(--c-brick); }
  .q small { display: block; font-size: 34px; font-weight: 700; color: var(--c-dark); opacity: .7; margin-top: 14px; }
  .shots { position: absolute; top: 540px; left: 80px; right: 80px; height: 640px; }
  .laptop { position: absolute; top: 90px; right: 0; width: 760px; }
  .laptop .scr { background: #120b08; border-radius: 22px 22px 0 0; padding: 14px; }
  .laptop img { width: 100%; display: block; border-radius: 6px; }
  .laptop .base { height: 24px; margin: 0 -40px; background: linear-gradient(#d8ccc0, #978b80); border-radius: 0 0 22px 22px; }
  .phone { position: absolute; top: 0; left: 0; width: 270px; height: 570px; border-radius: 42px; background: #120b08; padding: 10px; box-shadow: 0 40px 70px rgba(36,19,14,.35); transform: rotate(-4deg); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 34px; display: block; }
  .card { position: absolute; top: 1290px; left: 60px; right: 60px; border-radius: 48px; background: var(--c-dood); color: var(--c-kahgel); padding: 54px 60px; }
  .card .a { display: flex; align-items: center; gap: 30px; }
  .card img { width: 140px; height: 158px; }
  .card b { display: block; font-size: 112px; font-weight: 900; line-height: 1; color: #fff; }
  .card b span { color: var(--c-brick); }
  .chips { display: flex; gap: 12px; margin-top: 40px; }
  .chips span { white-space: nowrap; font-size: 28px; font-weight: 700; border: 2px solid rgba(248,221,211,.35); border-radius: 999px; padding: 10px 28px; }
  .chips span.h { margin-inline-start: auto; background: var(--c-brick); border-color: var(--c-brick); color: #fff; }
</style></head>
<body>
  <div class="q">این سایت <span>کار کیه؟</span><small>فروشگاه اینترنتی مانتو آنلاین</small></div>
  <div class="shots">
    <div class="laptop"><div class="scr"><img src="desktop-hero.png" alt=""></div><div class="base"></div></div>
    <div class="phone"><img src="mobile-hero.png" alt=""></div>
  </div>
  <div class="card">
    <div class="a"><img src="logo-dark.svg" alt=""><b>کار <span>چارطاق</span>.</b></div>
    <div class="chips"><span>طراحی سایت</span><span>پوستر</span><span>سئو</span><span class="h latin">@chartagh.agency</span></div>
  </div>
</body></html>
