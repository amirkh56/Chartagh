<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>مانتو آنلاین — پوستر ۱</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: radial-gradient(120% 70% at 50% 62%, #fff8ee 0%, var(--m-cream) 45%, var(--m-sand) 100%); color: var(--m-ink); }
  .arch { position: absolute; left: 50%; top: 560px; width: 760px; height: 1360px; transform: translateX(-50%); border-radius: 380px 380px 0 0; background: var(--m-sand); opacity: .55; }
  header { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
  .tag { display: inline-block; font-size: 30px; font-weight: 700; color: var(--m-brown); border: 2px solid var(--m-taupe); border-radius: 999px; padding: 8px 30px; }
  h1 { font-size: 104px; font-weight: 900; line-height: 1.15; margin-top: 26px; }
  .url { position: absolute; top: 585px; left: 50%; transform: translateX(-50%); background: #fff; box-shadow: 0 12px 40px rgba(51,40,33,.14); color: var(--m-ink); }
  .url i { background: var(--m-ink); color: var(--m-cream); font-size: 30px; }
  .phone { position: absolute; top: 730px; left: 50%; transform: translateX(-50%) rotate(-3deg); width: 470px; height: 860px; border-radius: 64px; background: #1a1411; padding: 16px; box-shadow: 0 60px 90px rgba(51,40,33,.35); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 50px; display: block; }
  .chip { position: absolute; background: var(--m-ink); color: var(--m-cream); font-size: 30px; font-weight: 700; padding: 18px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(51,40,33,.25); }
  .c1 { top: 900px; right: 70px; }
  .c2 { top: 1240px; left: 60px; background: #fff; color: var(--m-ink); }
  .credit { bottom: 210px; padding: 24px 32px; border-radius: 30px; left: 70px; right: 70px; background: var(--c-dood); color: var(--c-kahgel); }
</style></head>
<body>
