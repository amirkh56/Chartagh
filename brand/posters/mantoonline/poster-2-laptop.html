<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>مانتو آنلاین — پوستر ۲</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: radial-gradient(90% 55% at 50% 52%, #5a4639 0%, var(--m-ink) 60%, #1f1813 100%); color: var(--m-cream); }
  header { position: absolute; top: 260px; right: 90px; left: 90px; }
  .tag { font-size: 30px; font-weight: 700; color: var(--m-sand); letter-spacing: .5px; }
  h1 { font-size: 112px; font-weight: 900; line-height: 1.12; margin-top: 18px; }
  h1 em { font-style: normal; color: var(--m-sand); }
  .url { position: absolute; top: 640px; right: 90px; background: rgba(248,239,227,.1); border: 2px solid rgba(216,197,173,.35); color: var(--m-cream); }
  .url i { background: var(--m-sand); color: var(--m-ink); font-size: 30px; }
  .laptop { position: absolute; top: 820px; left: 50%; transform: translateX(-50%); width: 900px; }
  .screen { background: #0e0b09; border-radius: 28px 28px 0 0; padding: 18px 18px 22px; box-shadow: 0 50px 100px rgba(0,0,0,.5); }
  .screen img { width: 100%; display: block; border-radius: 8px; }
  .base { height: 30px; margin: 0 -50px; background: linear-gradient(#cfc4b8, #8e8379); border-radius: 0 0 26px 26px; position: relative; }
  .base::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 12px; background: #7d7268; border-radius: 0 0 12px 12px; }
  .feats { position: absolute; top: 1430px; left: 90px; right: 90px; display: flex; justify-content: space-between; }
  .feats div { font-size: 31px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .feats div::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--m-sand); }
  .credit { bottom: 220px; justify-content: center; border-top: 2px solid rgba(216,197,173,.2); padding-top: 34px; }
  .credit svg { width: 58px; height: 66px; }
  .credit b { font-size: 29px; }
  .credit small { font-size: 24px; }
  .credit .handle { margin-inline-start: 40px; }
</style></head>
<body>
  <header>
    <div class="tag">سایت جدید آنلاین شد</div>
    <h1>خرید مانتو،<br><em>از همین حالا آنلاین.</em></h1>
  </header>
  <div class="url"><span class="latin">mantoonline.com</span><i>⌕</i></div>
  <div class="laptop">
    <div class="screen"><img src="desktop-hero.png" alt=""></div>
    <div class="base"></div>
  </div>
  <div class="feats"><div>تولید مستقیم</div><div>ارسال رایگان</div><div>پشتیبانی ۲۴ ساعته</div></div>
  <div class="credit">
    <svg viewBox="8 -4 184 208"><path d="M13.40 50.00 L100.00 100.00 L100.00 200.00 L87.01 192.50 L87.01 150.50 C87.01 120.50 61.90 99.00 56.70 95.00 C51.50 93.00 26.39 85.50 26.39 115.50 L26.39 157.50 L13.40 150.00Z" fill="#F8DDD3"/><path d="M100.00 100.00 L186.60 50.00 L186.60 150.00 L173.61 157.50 L173.61 115.50 C173.61 85.50 148.50 93.00 143.30 95.00 C138.10 99.00 112.99 120.50 112.99 150.50 L112.99 192.50 L100.00 200.00Z" fill="#D9C5A0"/><path d="M100.00 100.00 L186.60 50.00 L100.00 0.00 L13.40 50.00Z" fill="#E2492D"/><path d="M71.13 83.33 L100.00 66.67 L42.27 33.33 L13.40 50.00Z" fill="#F8DDD3"/><path d="M128.87 50.00 L157.73 33.33 L128.87 16.67 L100.00 33.33Z" fill="#F8DDD3"/><path d="M13.40 50.00 L100.00 100.00 L186.60 50.00 M100.00 100.00 L100.00 200.00" fill="none" stroke="#332821" stroke-width="3" stroke-linejoin="round"/></svg>
    <div><b>طراحی و توسعه: چارطاق</b><small>طراحی سایت، پوستر و سئو</small></div>
    <span class="handle latin">@chartagh.agency</span>
  </div>
</body></html>
