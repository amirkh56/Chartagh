<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>مانتو آنلاین — پوستر ۳</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: var(--c-dark); color: var(--m-cream); }
  .photo { position: absolute; inset: 0 0 auto 0; height: 1500px; background: url(photos/p10.jpg) center 20% / cover; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(36,19,14,.85) 88%, var(--c-dark)); }
  .tag { position: absolute; top: 250px; left: 80px; font-size: 30px; font-weight: 700; padding: 12px 30px; border-radius: 999px; background: rgba(248,239,227,.92); color: var(--m-ink); }
  h1 { position: absolute; top: 1060px; right: 80px; font-size: 104px; font-weight: 900; line-height: 1.12; text-shadow: 0 6px 30px rgba(0,0,0,.35); }
  h1 em { font-style: normal; color: var(--m-sand); }
  .url { position: absolute; top: 1330px; right: 80px; background: var(--m-cream); color: var(--m-ink); font-size: 32px; padding: 14px 38px; }
  .q { position: absolute; top: 1500px; right: 80px; left: 80px; font-size: 54px; font-weight: 900; color: var(--c-kahgel); }
  .q span { color: #ffb59f; }
  .credit { top: 1600px; }
  .credit img { width: 96px; height: 108px; }
  .credit b { font-size: 46px; color: #fff; }
  .credit small { font-size: 28px; color: var(--c-kahgel); opacity: .85; }
  .credit .handle { color: var(--c-kahgel); font-size: 28px; }
</style></head>
<body>
  <div class="photo"></div>
  <div class="tag">کالکشن پاییز</div>
  <h1>این‌قدر شیک،<br><em>این‌قدر ساده.</em></h1>
  <div class="url latin">mantoonline.com</div>
  <div class="q">این سایت را <span>کی</span> دوخته؟</div>
  <div class="credit">
    <img src="logo-dark.svg" alt="">
    <div><b>چارطاق</b><small>طراحی سایتی که به برندتان می‌آید</small></div>
    <span class="handle latin">@chartagh.agency</span>
  </div>
</body></html>
