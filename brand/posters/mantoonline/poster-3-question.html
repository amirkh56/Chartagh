<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>مانتو آنلاین — پوستر ۳</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { background: var(--m-cream); color: var(--m-ink); }
  header { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
  h1 { font-size: 88px; font-weight: 900; line-height: 1.2; }
  h1 em { font-style: normal; color: var(--m-taupe); }
  /* the site's hero card, framed in a Persian arch */
  .arch { position: absolute; top: 540px; left: 50%; transform: translateX(-50%); width: 700px; height: 700px; border-radius: 350px 350px 36px 36px; overflow: hidden; box-shadow: 0 40px 80px rgba(51,40,33,.3);
    background: url(mobile-hero.png) no-repeat; background-size: 936px auto; background-position: -150px -440px; }
  /* fade out before the site's own slide text starts */
  .arch::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(transparent, #3a2c24 55%); }
  /* replaces the site's clipped «۵ دقیقه» badge */
  .badge { position: absolute; top: 548px; left: 128px; width: 240px; height: 240px; border-radius: 50%; background: var(--m-cream); color: var(--m-ink); box-shadow: 0 20px 40px rgba(51,40,33,.3);
    display: grid; place-content: center; text-align: center; font-size: 34px; font-weight: 700; line-height: 1.3; }
  .badge b { font-size: 64px; font-weight: 900; display: block; }
  .arch::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 10px var(--m-cream), inset 0 0 0 12px var(--m-taupe); }
  .url { position: absolute; top: 1206px; left: 50%; transform: translateX(-50%); background: var(--m-ink); color: var(--m-cream); font-size: 30px; padding: 14px 36px; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: var(--c-dark); color: var(--c-kahgel);
    border-radius: 60px 60px 0 0; padding: 70px 80px 0; }
  .band .q { font-size: 64px; font-weight: 900; }
  .band .q span { color: #ffb59f; }
  .credit { position: static; margin-top: 34px; }
  .credit svg { width: 92px; height: 104px; }
  .credit b { font-size: 42px; }
  .credit small { font-size: 27px; }
</style></head>
<body>
  <header><h1>این‌قدر شیک،<br><em>این‌قدر ساده.</em></h1></header>
  <div class="arch"></div>
  <div class="badge"><b>۵</b>دقیقه تا خرید</div>
  <div class="url latin">mantoonline.com</div>
  <div class="band">
    <div class="q">این سایت را <span>کی</span> دوخته؟</div>
    <div class="credit">
      <svg viewBox="8 -4 184 208"><path d="M13.40 50.00 L100.00 100.00 L100.00 200.00 L87.01 192.50 L87.01 150.50 C87.01 120.50 61.90 99.00 56.70 95.00 C51.50 93.00 26.39 85.50 26.39 115.50 L26.39 157.50 L13.40 150.00Z" fill="#F8DDD3"/><path d="M100.00 100.00 L186.60 50.00 L186.60 150.00 L173.61 157.50 L173.61 115.50 C173.61 85.50 148.50 93.00 143.30 95.00 C138.10 99.00 112.99 120.50 112.99 150.50 L112.99 192.50 L100.00 200.00Z" fill="#D9C5A0"/><path d="M100.00 100.00 L186.60 50.00 L100.00 0.00 L13.40 50.00Z" fill="#E2492D"/><path d="M71.13 83.33 L100.00 66.67 L42.27 33.33 L13.40 50.00Z" fill="#F8DDD3"/><path d="M128.87 50.00 L157.73 33.33 L128.87 16.67 L100.00 33.33Z" fill="#F8DDD3"/><path d="M13.40 50.00 L100.00 100.00 L186.60 50.00 M100.00 100.00 L100.00 200.00" fill="none" stroke="#7E2414" stroke-width="3" stroke-linejoin="round"/></svg>
      <div><b>چارطاق</b><small>طراحی سایتی که به برندتان می‌آید</small></div>
      <span class="handle latin">@chartagh.agency</span>
    </div>
  </div>
</body></html>
