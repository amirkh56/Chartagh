<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>چارطاق — اعلان (مکسیمال)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Lalezar&display=block">
<link rel="stylesheet" href="poster.css"><link rel="stylesheet" href="../../shared/ornaments.css">
<style>
  /* old Tehran street-flyer: ruled frame, Lalezar masthead, torn photo strips, ticket stub */
  body { background: #f3e8d6; color: var(--c-dood); overflow: hidden; }
  .frame { position: absolute; inset: 150px 34px 150px; border: 5px solid var(--c-dood); }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1.5px solid var(--c-dood); }
  .corner { position: absolute; width: 150px; height: 150px; background: var(--c-brick); opacity: .7; }
  .mast { position: absolute; top: 190px; left: 0; right: 0; text-align: center; }
  .mast .lalezar { position: relative; display: inline-block; font-size: 270px; line-height: 1; color: var(--c-brick); }
  .mast .lalezar::before { content: attr(data-t); position: absolute; inset: 0; color: var(--c-dood); transform: translate(6px, 5px); mix-blend-mode: multiply; opacity: .45; z-index: -1; }
  .rule { position: absolute; top: 500px; left: 90px; right: 90px; display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 700; }
  .rule::before, .rule::after { content: ''; flex: 1; border-top: 3px solid var(--c-dood); }
  .tear { position: absolute; top: 600px; width: 300px; height: 560px; filter: drop-shadow(0 12px 14px rgba(40,20,10,.35)); }
  .tear > div { width: 100%; height: 100%; background-size: cover; background-position: center 15%; }
  .shot { position: absolute; top: 1000px; left: 380px; width: 330px; height: 420px; z-index: 4; transform: rotate(2.5deg); }
  .shot > div { width: 100%; height: 100%; background: url(../assets/mobile-hero.png) center 0 / cover; }
  .note { position: absolute; top: 1440px; right: 90px; font-size: 54px; color: var(--c-brick); transform: rotate(-3deg); z-index: 6; }
  .stub { position: absolute; top: 1530px; left: 90px; right: 90px; height: 170px; background: var(--c-dood); color: var(--c-kahgel); display: flex; align-items: center; padding: 0 50px; gap: 26px; transform: rotate(-1deg);
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 22px, #000 23px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 22px, #000 23px) right / 51% 100% no-repeat; }
  .stub img { width: 76px; height: 86px; }
  .stub b { font-size: 50px; font-weight: 900; }
  .stub .latin { margin-inline-start: auto; font-size: 32px; border-inline-start: 3px dashed rgba(248,221,211,.5); padding-inline-start: 34px; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="corner p-eslimi" style="top:150px;right:34px"></div>
  <div class="corner p-eslimi" style="bottom:150px;left:34px"></div>
  <div class="mast"><span class="lalezar" data-t="چارطاق">چارطاق</span></div>
  <div class="rule">طراحی سایت · پوستر · سئو</div>

  <div class="tear" style="left:720px;transform:rotate(2deg)"><div class="torn" data-depth="16" style="background-image:url(../assets/photos/p10.jpg)"></div></div>
  <div class="tear" style="left:390px;top:630px;height:540px;transform:rotate(-1.5deg)"><div class="torn" data-depth="16" style="background-image:url(../assets/photos/p28.jpg)"></div></div>
  <div class="tear" style="left:60px;top:590px;transform:rotate(-3deg)"><div class="torn" data-depth="16" style="background-image:url(../assets/photos/p26.jpg)"></div></div>
  <div class="print shot"><div></div></div>
  <div class="tape" style="top:985px;left:460px;transform:rotate(-4deg)"></div>
  <div class="tape" style="top:590px;right:150px;transform:rotate(6deg);width:140px"></div>

  <div class="note hand">سایت مانتو آنلاین رو ما دوختیم</div>
  <svg class="scribble" style="top:1290px;left:150px;width:200px;height:150px" viewBox="0 0 200 150" stroke="#E2492D" stroke-width="6">
    <path d="M190 120 C 130 140, 60 110, 40 40"/><path d="M22 66 L38 34 L64 56"/>
  </svg>
  <div class="stub"><img src="logo-dark.svg" alt=""><b>سفارش سایت</b><span class="latin">@chartagh.agency</span></div>
  <div class="grain"></div>
  <script src="torn.js"></script>
</body></html>
