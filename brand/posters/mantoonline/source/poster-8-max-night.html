<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>چارطاق — چاپ (مکسیمال)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Lalezar&display=block">
<link rel="stylesheet" href="poster.css"><link rel="stylesheet" href="../../shared/ornaments.css">
<style>
  /* screen-printed poster: duotone halftone photo, misregistered headline, torn answer sheet */
  body { background: var(--c-dood); color: var(--c-kahgel); overflow: hidden; }
  .photo { position: absolute; inset: 0 0 auto 0; height: 1420px; background: #d9573c; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; filter: grayscale(1) contrast(1.25) brightness(1.08); mix-blend-mode: multiply; display: block; }
  .photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(36,19,14,.55), transparent 40%); z-index: 1; }
  .q { position: absolute; top: 230px; right: 60px; z-index: 3; font-size: 170px; line-height: .95; color: var(--c-kahgel); }
  .q div { position: relative; }
  .q div::before { content: attr(data-t); position: absolute; inset: 0; color: #E2492D; transform: translate(-6px, 5px); z-index: -1; }
  .q div + div { font-size: 210px; }
  .scr { top: 410px; right: 20px; width: 470px; height: 260px; }
  .sheet { position: absolute; top: 1300px; left: -20px; right: -20px; bottom: -20px; z-index: 5; filter: drop-shadow(0 -10px 14px rgba(0,0,0,.45)); }
  .sheet > div { width: 100%; height: 100%; background: #f2e6d4; padding: 70px 90px 0; color: var(--c-dood); }
  .ans { font-size: 70px; color: var(--c-brick); transform: rotate(-4deg); display: inline-block; }
  .word { position: relative; font-size: 220px; font-weight: 900; line-height: 1; margin-top: -10px; }
  .word::before { content: attr(data-t); position: absolute; inset: 0; color: var(--c-brick); transform: translate(5px, 4px); mix-blend-mode: multiply; opacity: .6; z-index: -1; }
  .meta { display: flex; align-items: center; gap: 20px; margin-top: 18px; font-size: 32px; font-weight: 700; }
  .meta img { width: 64px; height: 72px; }
  .meta .latin { margin-inline-start: auto; }
  .stamp { position: absolute; top: 1190px; left: 40px; width: 250px; transform: rotate(11deg); z-index: 6; mix-blend-mode: multiply; opacity: .9; }
  .tape { z-index: 7; }
</style></head>
<body>
  <div class="photo halftone"><img src="../assets/photos/p10.jpg" alt=""></div>
  <div class="q lalezar"><div data-t="این سایت">این سایت</div><div data-t="کار کیه؟">کار کیه؟</div></div>
  <svg class="scribble scr" viewBox="0 0 470 260" stroke="#F8DDD3" stroke-width="8">
    <path d="M300 30 C 150 10, 20 60, 30 150 S 250 260, 400 200 S 470 60, 250 40"/>
  </svg>
  <div class="sheet"><div class="torn" data-edge="top" data-depth="22">
    <span class="ans hand">جوابش:</span>
    <div class="word" data-t="چارطاق">چارطاق</div>
    <div class="meta"><img src="logo-light.svg" alt="">طراحی سایت · پوستر · سئو<span class="latin">@chartagh.agency</span></div>
  </div></div>
  <div class="tape" style="top:1285px;right:120px;transform:rotate(5deg)"></div>
  <svg class="stamp" viewBox="0 0 200 200">
    <defs>
      <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="5"/></filter>
      <path id="c" d="M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0"/>
    </defs>
    <g filter="url(#ink)" fill="none" stroke="#7E2414">
      <circle cx="100" cy="100" r="94" stroke-width="6"/><circle cx="100" cy="100" r="56" stroke-width="3"/>
      <text direction="ltr" font-family="Yekan" font-weight="900" font-size="24" fill="#7E2414" stroke="none" letter-spacing="1"><textPath href="#c">چارطاق · طراحی سایت · چارطاق ·</textPath></text>
      <text x="100" y="112" text-anchor="middle" font-family="Yekan" font-weight="900" font-size="34" fill="#7E2414" stroke="none">چارطاق</text>
    </g>
  </svg>
  <div class="grain"></div>
  <script src="torn.js"></script>
</body></html>
