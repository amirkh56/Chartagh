<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>مانتو آنلاین — پوستر ۲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Lalezar&display=block">
<link rel="stylesheet" href="poster.css">
<style>
  body { background: var(--m-ink); color: var(--m-cream); overflow: hidden; }
  .tag { position: absolute; top: 230px; right: 90px; font-size: 56px; color: var(--m-sand); transform: rotate(-3deg); }
  h1 { position: absolute; top: 320px; right: 90px; left: 60px; font-size: 128px; line-height: 1.05; }
  h1 div { position: relative; }
  h1 div::before { content: attr(data-t); position: absolute; inset: 0; color: var(--c-brick); transform: translate(-5px, 4px); z-index: -1; opacity: .85; }
  h1 div + div { color: var(--m-sand); }
  .scr-u { top: 590px; right: 90px; width: 520px; height: 40px; }
  .url { position: absolute; top: 650px; right: 90px; background: #fbf7ef; color: var(--m-ink); border-radius: 6px; transform: rotate(1.5deg); }
  .url i { background: var(--m-ink); color: var(--m-cream); font-size: 30px; }
  .laptop { position: absolute; top: 820px; left: 50%; transform: translateX(-50%) rotate(-1.5deg); width: 900px; }
  .screen { background: #0e0b09; border-radius: 28px 28px 0 0; padding: 18px 18px 22px; box-shadow: 0 40px 70px rgba(0,0,0,.55); }
  .screen img { width: 100%; display: block; border-radius: 8px; }
  .base { height: 30px; margin: 0 -50px; background: linear-gradient(#cfc4b8, #8e8379); border-radius: 0 0 26px 26px; }
  .feats { position: absolute; top: 1440px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 54px; color: var(--m-sand); }
  .feats span:nth-child(2) { transform: rotate(-3deg); } .feats span:nth-child(1) { transform: rotate(2deg); }
  .credit { position: absolute; top: 1570px; left: 90px; right: 90px; display: flex; align-items: center; gap: 22px; border-top: 2px dashed rgba(216,197,173,.4); padding-top: 34px; }
  .credit img { width: 62px; height: 70px; }
  .credit b { font-size: 32px; font-weight: 900; display: block; } .credit small { font-size: 24px; opacity: .75; }
  .credit .latin { margin-inline-start: auto; font-size: 26px; opacity: .85; }
  .grain { opacity: .3; mix-blend-mode: screen; filter: invert(1); }
</style></head>
<body>
  <div class="tag hand">سایت جدیدمون آنلاین شد!</div>
  <h1 class="lalezar"><div data-t="خرید مانتو،">خرید مانتو،</div><div data-t="حالا آنلاین.">حالا آنلاین.</div></h1>
  <svg class="scribble scr-u" viewBox="0 0 520 40" stroke="#E2492D" stroke-width="7"><path d="M10 25 C 140 8, 320 34, 510 14"/></svg>
  <div class="url"><span class="latin">mantoonline.com</span><i>⌕</i></div>
  <div class="laptop"><div class="screen"><img src="../assets/desktop-hero.png" alt=""></div><div class="base"></div></div>
  <div class="tape" style="top:800px;left:110px;transform:rotate(-20deg)"></div>
  <div class="tape" style="top:800px;right:110px;transform:rotate(18deg)"></div>
  <div class="feats hand"><span>تولید مستقیم</span><span>ارسال رایگان</span><span>پشتیبانی ۲۴ساعته</span></div>
  <div class="credit"><img src="logo-dark.svg" alt=""><div><b>طراحی و توسعه: چارطاق</b><small>طراحی سایت، پوستر و سئو</small></div><span class="latin">@chartagh.agency</span></div>
  <div class="grain"></div>
</body></html>
