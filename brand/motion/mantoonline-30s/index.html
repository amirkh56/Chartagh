    <script>
      (function () {
        // deterministic hash — no Math.random
        function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

        // torn edges on photo/screenshot prints (seeded, built once)
        document.querySelectorAll(".torn").forEach(function (el, k) {
          var pts = [], i = 0;
          for (var x = 0; x <= 100; x += 1.8 + rnd(k * 50 + i++) * 2.4) pts.push(x.toFixed(1) + "% " + (rnd(k * 70 + i) * 14).toFixed(1) + "px");
          var bot = [];
          for (var y = 100; y >= 0; y -= 1.8 + rnd(k * 90 + i++) * 2.4) bot.push(y.toFixed(1) + "% calc(100% - " + (rnd(k * 30 + i) * 14).toFixed(1) + "px)");
          el.style.clipPath = "polygon(" + pts.concat(bot).join(",") + ")";
        });

        function prepDraw(sel) {
          document.querySelectorAll(sel).forEach(function (p) {
            var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L;
          });
        }
        prepDraw("#thread .seg"); prepDraw("svg .dr");

        // ---- inner: paper pieces, played at a stop-motion cadence (12 fps) ----
        var inner = gsap.timeline({ paused: true });
        function slap(sel, t, r) {
          r = r || 0;
          inner.fromTo(sel, { opacity: 0, scale: 1.22, rotation: r + 9, y: -26 }, { opacity: 1, scale: 1, rotation: r, y: 0, duration: 0.34, ease: "back.out(2.2)" }, t);
        }
        function slam(sel, t) { inner.fromTo(sel, { opacity: 0, scale: 2.1 }, { opacity: 1, scale: 1, duration: 0.28, ease: "power4.out" }, t); }
        function tape(sel, t) { inner.fromTo(sel, { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "power1.out" }, t); }
        function write(sel, t, d) { inner.fromTo(sel, { clipPath: "inset(-20% 0% -20% 100%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: d || 0.8, ease: "none" }, t); }
        function draw(sel, t, d) {
          document.querySelectorAll(sel).forEach(function (p) {
            inner.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power1.inOut" }, t);
          });
        }
        function fadeIn(sel, t, o) { inner.fromTo(sel, { opacity: 0 }, { opacity: o, duration: 0.5, ease: "none" }, t); }

        // A
        fadeIn("#a-toranj", 0.2, 0.18);
        write("#a-kick", 0.5, 0.9);
        slam("#a-w1", 1.0); slam("#a-w2", 1.3);
        slap("#a-url", 1.75, -2); tape("#a-tape", 2.05);
        // B
        slap("#b-phone", 4.75, -2); tape("#b-tape", 5.1);
        slap("#b-photo", 5.3, -6); tape("#b-tape2", 5.55);
        write("#b-note", 5.8, 0.8); draw("#b-arrow .dr", 6.6, 0.5);
        // C
        slap("#c-p1", 9.85, -5); tape("#c-t1", 10.15);
        slap("#c-p2", 10.2, 5); tape("#c-t2", 10.45);
        write("#c-l1", 10.6, 0.7); slam("#c-l2", 11.35);
        inner.fromTo("#c-sham", { opacity: 0, rotation: -120, scale: 0.4 }, { opacity: 1, rotation: 12, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 11.8);
        // D
        slap("#d-lap", 14.75, -1.5); tape("#d-t1", 15.05); tape("#d-t2", 15.15);
        write("#d-n1", 15.35, 0.6); draw("#d-arrow .dr", 15.9, 0.45);
        write("#d-n2", 16.2, 0.8);
        fadeIn("#d-sham", 15.6, 0.22);
        // E
        slam("#e-w1", 19.6); slam("#e-w2", 20.0);
        draw("#e-loop .dr", 20.6, 0.8);
        // finale (absolute times)
        fadeIn("#f-toranj", 24.0, 0.16);
        write("#f-ans", 24.1, 0.6);
        slap("#f-logo", 24.5, -4);
        slam("#f-word", 24.85);
        draw("#f-loop .dr", 25.3, 0.9);
        inner.fromTo("#f-stamp", { opacity: 0, scale: 1.9, rotation: -30 }, { opacity: 0.9, scale: 1, rotation: -12, duration: 0.16, ease: "power3.in" }, 26.0);
        write("#f-serv", 26.0, 0.7);
        slap("#f-handle", 26.5, 2); tape("#f-t3", 26.8);
        slap("#f-p1", 25.55, -9); tape("#f-t1", 25.75); slap("#f-p2", 25.75, 8); tape("#f-t2", 25.95);
        inner.seek(0);

        // ---- main: smooth camera + thread, and the stop-motion driver ----
        var tl = gsap.timeline({ paused: true, onUpdate: function () { drive(tl.time()); } });
        tl.to({ p: 0 }, { p: 1, duration: 30, ease: "none" }, 0);

        var world = document.getElementById("world");
        var stations = [[540, 960], [540, 2880], [1620, 2880], [1620, 4800], [2700, 4800]];
        var moves = [3.8, 8.9, 13.8, 18.6];
        function camAt(i) { return { x: 540 - stations[i][0], y: 960 - stations[i][1] }; }
        tl.set(world, camAt(0), 0);
        moves.forEach(function (t, i) { tl.fromTo(world, camAt(i), Object.assign(camAt(i + 1), { duration: 0.9, ease: "power2.inOut" }), t); });

        var segWin = [[0.0, 1.5], [3.5, 4.75], [8.6, 9.85], [13.5, 14.75], [18.3, 19.55]];
        segWin.forEach(function (w, k) {
          document.querySelectorAll("#thread .s" + k).forEach(function (p) {
            tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: w[1] - w[0], ease: "power1.inOut" }, w[0]);
          });
        });

        var cam = document.getElementById("cam");
        var boils = document.querySelectorAll(".boil");
        var grain = document.getElementById("grain");
        function drive(t) {
          var step = Math.floor(t * 12 + 1e-6);
          inner.seek(step / 12, false);
          var b = Math.floor(step / 2);
          for (var i = 0; i < boils.length; i++) {
            gsap.set(boils[i], { x: (rnd(b * 13 + i * 101) - 0.5) * 3, y: (rnd(b * 29 + i * 211) - 0.5) * 3, rotation: (rnd(b * 47 + i * 331) - 0.5) * 0.7 });
          }
          // handheld sway on the camera rig
          gsap.set(cam, { x: Math.sin(t * 0.9) * 5, y: Math.cos(t * 0.7) * 4, rotation: Math.sin(t * 0.5) * 0.25 });
          grain.style.backgroundPosition = Math.floor(rnd(step) * 300) + "px " + Math.floor(rnd(step + 999) * 300) + "px";
        }

        tl.seek(0);
        drive(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
